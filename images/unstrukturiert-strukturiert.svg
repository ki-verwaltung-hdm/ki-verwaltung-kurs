<rect width="1600" height="620" fill="#11161d"/>
<text x="800" y="60" font-size="15" fill="#88F297" font-weight="600" text-anchor="middle" font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' opacity="1">WORUM ES IM PROJEKT GEHT</text>
<text x="800" y="110" font-size="30" fill="#f2f5ff" font-weight="700" text-anchor="middle" font-family='"Avenir Next","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif' opacity="1">Unstrukturierte Informationen werden zu einer Entscheidungsvorlage</text>
