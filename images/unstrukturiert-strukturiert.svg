<text x="270" y="495" font-size="17" fill="#aab4c8" font-weight="400" text-anchor="middle" font-family='"Avenir Next","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif' opacity="1">verstreut, uneinheitlich, in Ordnern</text>
