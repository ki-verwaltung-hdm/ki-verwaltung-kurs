<rect x="570" y="170" width="440" height="340" rx="16" fill="#1a2030" stroke="#88F297" stroke-width="2"/>
<text x="790" y="215" font-size="24" fill="#88F297" font-weight="700" text-anchor="middle" font-family='"Avenir Next","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif' opacity="1">KI-Agent</text>
<g transform="translate(790,250) scale(1.2)"><rect x="-22" y="8" width="44" height="36" rx="8" fill="#88F297"/><rect x="-28" y="20" width="6" height="12" rx="2" fill="#88F297"/><rect x="22" y="20" width="6" height="12" rx="2" fill="#88F297"/><line x1="0" y1="8" x2="0" y2="-2" stroke="#88F297" stroke-width="3"/><circle cx="0" cy="-5" r="4" fill="#88F297"/><circle cx="-9" cy="24" r="4" fill="#11161d"/><circle cx="9" cy="24" r="4" fill="#11161d"/><rect x="-10" y="33" width="20" height="4" rx="2" fill="#11161d"/></g>
<text x="790" y="345.0" font-size="20" fill="#f2f5ff" font-weight="400" text-anchor="middle" font-family='"Avenir Next","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif' opacity="1">sammelt die Angaben,</text>
<text x="790" y="371.0" font-size="20" fill="#f2f5ff" font-weight="400" text-anchor="middle" font-family='"Avenir Next","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif' opacity="1">prüft sie gegen Regeln,</text>
<text x="790" y="397.0" font-size="20" fill="#f2f5ff" font-weight="400" text-anchor="middle" font-family='"Avenir Next","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif' opacity="1">fasst sie zu einer Übersicht zusammen</text>
<text x="790" y="423.0" font-size="20" fill="#f2f5ff" font-weight="400" text-anchor="middle" font-family='"Avenir Next","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif' opacity="1">und markiert, was fehlt</text>
<text x="790" y="490" font-size="17" fill="#aab4c8" font-weight="400" text-anchor="middle" font-family='"Avenir Next","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif' opacity="1">liest nur, schreibt in kein System</text>
<line x1="1020" y1="340" x2="1110" y2="340" stroke="#88F297" stroke-width="3" marker-end="url(#arr)"/>
<rect x="1120" y="170" width="400" height="340" rx="16" fill="#1a2030" stroke="#6fb6f0" stroke-width="2"/>
<text x="1320" y="215" font-size="24" fill="#6fb6f0" font-weight="700" text-anchor="middle" font-family='"Avenir Next","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif' opacity="1">Mensch entscheidet</text>
<g transform="translate(1240,285) scale(1.1)"><rect x="-26" y="-20" width="52" height="40" rx="4" fill="none" stroke="#88F297" stroke-width="3"/><line x1="-26" y1="-7" x2="26" y2="-7" stroke="#88F297" stroke-width="3"/><line x1="-26" y1="6" x2="26" y2="6" stroke="#88F297" stroke-width="3"/><line x1="-8" y1="-20" x2="-8" y2="20" stroke="#88F297" stroke-width="3"/><line x1="9" y1="-20" x2="9" y2="20" stroke="#88F297" stroke-width="3"/></g>
<g transform="translate(1400,250) scale(1.1)"><circle cx="0" cy="12" r="11" fill="#6fb6f0"/><path d="M-20,62 C-20,36 -10,28 0,28 C10,28 20,36 20,62 Z" fill="#6fb6f0"/></g>
<text x="1320" y="370.0" font-size="20" fill="#f2f5ff" font-weight="400" text-anchor="middle" font-family='"Avenir Next","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif' opacity="1">Übersicht mit Status je</text>
<text x="1320" y="396.0" font-size="20" fill="#f2f5ff" font-weight="400" text-anchor="middle" font-family='"Avenir Next","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif' opacity="1">Voraussetzung und Grundlage.</text>
<text x="1320" y="422.0" font-size="20" fill="#f2f5ff" font-weight="400" text-anchor="middle" font-family='"Avenir Next","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif' opacity="1">Die Entscheidung trifft</text>
<text x="1320" y="448.0" font-size="20" fill="#f2f5ff" font-weight="400" text-anchor="middle" font-family='"Avenir Next","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif' opacity="1">die zuständige Person.</text>
<text x="800" y="580" font-size="19" fill="#aab4c8" font-weight="400" text-anchor="middle" font-family='"Avenir Next","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif' opacity="1">Wir suchen Tätigkeiten dieser Art, nicht die vollautomatische Abwicklung eines Workflows.</text>
