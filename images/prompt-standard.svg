<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 620" width="1600" height="620" font-family='"Avenir Next","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif'>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#88F297"/></marker><marker id="arrs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aab4c8"/></marker><marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffa65c"/></marker></defs>
<rect width="1600" height="620" fill="#11161d"/>
<text x="800" y="60" font-size="15" fill="#88F297" font-weight="600" text-anchor="middle" font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' opacity="1">AUFTRÄGE FORMULIEREN</text>
<text x="800" y="110" font-size="30" fill="#f2f5ff" font-weight="700" text-anchor="middle" font-family='"Avenir Next","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif' opacity="1">Vier Teile in fester Reihenfolge: Kontext, Aufgabe, Format, Prüfung</text>
<rect x="140" y="170" width="1320" height="84" rx="16" fill="#1a2030" stroke="#88F297" stroke-width="2"/>
<rect x="140" y="170" width="190" height="84" rx="16" fill="#88F297" opacity="0.18"/>
<text x="235" y="222" font-size="24" fill="#88F297" font-weight="700" text-anchor="middle" font-family='"Avenir Next","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif' opacity="1">Kontext</text>
<text x="360" y="206" font-size="20" fill="#f2f5ff" font-weight="700" text-anchor="start" font-family='"Avenir Next","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif' opacity="1">Die Fakten, die nur wir kennen</text>
<text x="360" y="236" font-size="17" fill="#aab4c8" font-weight="400" text-anchor="start" font-family='"Avenir Next","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif' opacity="1">Protokoll, Rollen, geltende Regeln. Steht oben, vor der Aufgabe.</text>
<rect x="140" y="270" width="1320" height="84" rx="16" fill="#1a2030" stroke="#6fb6f0" stroke-width="2"/>
<rect x="140" y="270" width="190" height="84" rx="16" fill="#6fb6f0" opacity="0.18"/>
<text x="235" y="322" font-size="24" fill="#6fb6f0" font-weight="700" text-anchor="middle" font-family='"Avenir Next","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif' opacity="1">Aufgabe</text>
<text x="360" y="306" font-size="20" fill="#f2f5ff" font-weight="700" text-anchor="start" font-family='"Avenir Next","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif' opacity="1">Das eine konkrete Ergebnis</text>
<text x="360" y="336" font-size="17" fill="#aab4c8" font-weight="400" text-anchor="start" font-family='"Avenir Next","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif' opacity="1">„Erstelle aus der Beschreibung den Ist-Prozess als BPMN-Datei.“</text>
<rect x="140" y="370" width="1320" height="84" rx="16" fill="#1a2030" stroke="#6fb6f0" stroke-width="2"/>
<rect x="140" y="370" width="190" height="84" rx="16" fill="#6fb6f0" opacity="0.18"/>
<text x="235" y="422" font-size="24" fill="#6fb6f0" font-weight="700" text-anchor="middle" font-family='"Avenir Next","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif' opacity="1">Format</text>
<text x="360" y="406" font-size="20" fill="#f2f5ff" font-weight="700" text-anchor="start" font-family='"Avenir Next","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif' opacity="1">Datei, Struktur, Sprache, Länge</text>
<text x="360" y="436" font-size="17" fill="#aab4c8" font-weight="400" text-anchor="start" font-family='"Avenir Next","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif' opacity="1">Dateiname, eine Bahn je Rolle, deutsche Namen, Verb am Ende.</text>
<rect x="140" y="470" width="1320" height="84" rx="16" fill="#1a2030" stroke="#88F297" stroke-width="2"/>
<rect x="140" y="470" width="190" height="84" rx="16" fill="#88F297" opacity="0.18"/>
<text x="235" y="522" font-size="24" fill="#88F297" font-weight="700" text-anchor="middle" font-family='"Avenir Next","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif' opacity="1">Prüfung</text>
<text x="360" y="506" font-size="20" fill="#f2f5ff" font-weight="700" text-anchor="start" font-family='"Avenir Next","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif' opacity="1">Was gemeldet statt erfunden wird</text>
<text x="360" y="536" font-size="17" fill="#aab4c8" font-weight="400" text-anchor="start" font-family='"Avenir Next","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif' opacity="1">„Nenne, welche Stellen unklar waren, statt Schritte zu erfinden.“</text>
<path d="M80,180 L80,545" stroke="#aab4c8" stroke-width="2" stroke-dasharray="4 6"/>
<text x="80" y="162" font-size="13" fill="#aab4c8" font-weight="400" text-anchor="middle" font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' opacity="1">Reihenfolge</text>
<text x="800" y="590" font-size="19" fill="#aab4c8" font-weight="400" text-anchor="middle" font-family='"Avenir Next","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif' opacity="1">Kontext und Prüfung bewegen das Ergebnis am meisten. Beide werden am häufigsten weggelassen.</text>
</svg>