<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 560" width="1600" height="560" font-family='"Avenir Next","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif'>
<defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#88F297"/></marker><marker id="arrs" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#aab4c8"/></marker><marker id="arro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#ffa65c"/></marker></defs>
<rect width="1600" height="560" fill="#11161d"/>
<text x="800" y="60" font-size="15" fill="#88F297" font-weight="600" text-anchor="middle" font-family='ui-monospace,SFMono-Regular,Menlo,Consolas,monospace' opacity="1">KEINE REALDATEN</text>
<text x="800" y="110" font-size="30" fill="#f2f5ff" font-weight="700" text-anchor="middle" font-family='"Avenir Next","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif' opacity="1">Der Prototyp spricht mit nachgebauten Systemen</text>
<rect x="80" y="180" width="420" height="280" rx="16" fill="#1a2030" stroke="#88F297" stroke-width="2"/>
<text x="290" y="225" font-size="24" fill="#88F297" font-weight="700" text-anchor="middle" font-family='"Avenir Next","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif' opacity="1">Prototyp in n8n</text>
<g transform="translate(290,290) scale(1.1)"><circle cx="0" cy="0" r="14" fill="none" stroke="#88F297" stroke-width="5"/><rect x="-4" y="-26" width="8" height="10" rx="2" fill="#88F297" transform="rotate(0)"/><rect x="-4" y="-26" width="8" height="10" rx="2" fill="#88F297" transform="rotate(45)"/><rect x="-4" y="-26" width="8" height="10" rx="2" fill="#88F297" transform="rotate(90)"/><rect x="-4" y="-26" width="8" height="10" rx="2" fill="#88F297" transform="rotate(135)"/><rect x="-4" y="-26" width="8" height="10" rx="2" fill="#88F297" transform="rotate(180)"/><rect x="-4" y="-26" width="8" height="10" rx="2" fill="#88F297" transform="rotate(225)"/><rect x="-4" y="-26" width="8" height="10" rx="2" fill="#88F297" transform="rotate(270)"/><rect x="-4" y="-26" width="8" height="10" rx="2" fill="#88F297" transform="rotate(315)"/></g>
<text x="290" y="370.0" font-size="19" fill="#aab4c8" font-weight="400" text-anchor="middle" font-family='"Avenir Next","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif' opacity="1">Workflow mit festen Regeln,</text>
<text x="290" y="394.7" font-size="19" fill="#aab4c8" font-weight="400" text-anchor="middle" font-family='"Avenir Next","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif' opacity="1">Modellschritt und</text>
<text x="290" y="419.4" font-size="19" fill="#aab4c8" font-weight="400" text-anchor="middle" font-family='"Avenir Next","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif' opacity="1">Freigabe durch einen Menschen</text>
<rect x="640" y="180" width="420" height="280" rx="16" fill="#1a2030" stroke="#6fb6f0" stroke-width="2"/>
<text x="850" y="225" font-size="24" fill="#6fb6f0" font-weight="700" text-anchor="middle" font-family='"Avenir Next","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif' opacity="1">Mock-Schnittstelle</text>
<g transform="translate(850,290) scale(1.2)"><rect x="-26" y="-20" width="52" height="40" rx="4" fill="none" stroke="#6fb6f0" stroke-width="3"/><line x1="-26" y1="-7" x2="26" y2="-7" stroke="#6fb6f0" stroke-width="3"/><line x1="-26" y1="6" x2="26" y2="6" stroke="#6fb6f0" stroke-width="3"/><line x1="-8" y1="-20" x2="-8" y2="20" stroke="#6fb6f0" stroke-width="3"/><line x1="9" y1="-20" x2="9" y2="20" stroke="#6fb6f0" stroke-width="3"/></g>
<text x="850" y="370.0" font-size="19" fill="#aab4c8" font-weight="400" text-anchor="middle" font-family='"Avenir Next","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif' opacity="1">erfundene Studierende, Anträge,</text>
<text x="850" y="394.7" font-size="19" fill="#aab4c8" font-weight="400" text-anchor="middle" font-family='"Avenir Next","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif' opacity="1">Nachweise; antwortet so, wie es</text>
<text x="850" y="419.4" font-size="19" fill="#aab4c8" font-weight="400" text-anchor="middle" font-family='"Avenir Next","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif' opacity="1">das echte System täte</text>
<line x1="510" y1="300" x2="630" y2="300" stroke="#88F297" stroke-width="3" marker-end="url(#arr)"/>
<text x="570" y="285" font-size="16" fill="#aab4c8" font-weight="400" text-anchor="middle" font-family='"Avenir Next","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif' opacity="1">fragt</text>
<line x1="630" y1="340" x2="510" y2="340" stroke="#88F297" stroke-width="3" marker-end="url(#arr)"/>
<text x="570" y="365" font-size="16" fill="#aab4c8" font-weight="400" text-anchor="middle" font-family='"Avenir Next","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif' opacity="1">antwortet</text>
<rect x="1200" y="180" width="320" height="280" rx="16" fill="#1a2030" stroke="#ff6b6b" stroke-width="2" stroke-dasharray="8 6"/>
<text x="1360" y="225" font-size="24" fill="#ff6b6b" font-weight="700" text-anchor="middle" font-family='"Avenir Next","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif' opacity="1">Echtes System</text>
<g transform="translate(1360,300) scale(1.2)"><path d="M-18,-24 h26 l10,10 v38 h-36 z" fill="none" stroke="#ff6b6b" stroke-width="3" stroke-linejoin="round"/><line x1="-10" y1="-4" x2="10" y2="-4" stroke="#ff6b6b" stroke-width="3"/><line x1="-10" y1="6" x2="10" y2="6" stroke="#ff6b6b" stroke-width="3"/><line x1="-10" y1="16" x2="10" y2="16" stroke="#ff6b6b" stroke-width="3"/><line x1="-10" y1="26" x2="10" y2="26" stroke="#ff6b6b" stroke-width="3"/></g>
<text x="1360" y="370.0" font-size="19" fill="#aab4c8" font-weight="400" text-anchor="middle" font-family='"Avenir Next","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif' opacity="1">Campus-System, Akten,</text>
<text x="1360" y="394.7" font-size="19" fill="#aab4c8" font-weight="400" text-anchor="middle" font-family='"Avenir Next","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif' opacity="1">Personaldaten:</text>
<text x="1360" y="419.4" font-size="19" fill="#aab4c8" font-weight="400" text-anchor="middle" font-family='"Avenir Next","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif' opacity="1">kein Zugriff im Projekt</text>
<g transform="translate(1130,320) scale(1.0)"><circle cx="0" cy="0" r="18" fill="#ff6b6b"/><path d="M-7,-7 L7,7 M7,-7 L-7,7" stroke="#11161d" stroke-width="4" stroke-linecap="round"/></g>
<line x1="1070" y1="320" x2="1105" y2="320" stroke="#aab4c8" stroke-width="3" marker-end="url(#arrs)" stroke-dasharray="6 6"/>
<text x="800" y="510.0" font-size="19" fill="#aab4c8" font-weight="400" text-anchor="middle" font-family='"Avenir Next","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif' opacity="1">Das Mock macht sichtbar, welche Daten der Prototyp bräuchte und welche Rechte dafür nötig wären. Beides steht in der Bewertung.</text>
</svg>