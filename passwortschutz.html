<link rel="icon" href="data:,">
<style id="kv26-sperre-stil">body > *:not(#kv26-sperre){visibility:hidden}</style>
<script>
// Einfacher clientseitiger Passwortschutz für die Kurswebsite.
// Schützt vor Gelegenheitszugriffen, ist keine echte Zugangskontrolle:
// Der Code läuft im Browser und ist im Quelltext lesbar.
// Passwort ändern: unten in KENNWOERTER. Danach neu veröffentlichen.
(function () {
  var SCHLUESSEL = 'kv26_zugang';
  var KENNWOERTER = ['verwaltung-hdm-26'];

  function freigeben() {
    var stil = document.getElementById('kv26-sperre-stil');
    if (stil) stil.remove();
    var sperre = document.getElementById('kv26-sperre');
    if (sperre) sperre.remove();
  }

  function gemerkt() {
    try { return !!localStorage.getItem(SCHLUESSEL); } catch (e) { return false; }
  }

  function merken() {
    try { localStorage.setItem(SCHLUESSEL, 'true'); } catch (e) { /* privater Modus */ }
  }

  function formularZeigen() {
    var box = document.createElement('div');
    box.id = 'kv26-sperre';
    box.setAttribute('style',
      'position:fixed;inset:0;z-index:99999;display:flex;align-items:center;' +
      'justify-content:center;background:#11161d;padding:1.5rem;' +
      'font-family:system-ui,-apple-system,Segoe UI,sans-serif');
    box.innerHTML =
      '<form style="width:100%;max-width:26rem;background:#fff;border-radius:12px;padding:2rem">' +
      '<h1 style="margin:0 0 .4rem;font-size:1.25rem;line-height:1.3;color:#11161d">' +
      'KI in der Verwaltung</h1>' +
      '<p style="margin:0 0 1.2rem;color:#4a5563;font-size:.95rem">' +
      'Bitte das Kurspasswort eingeben.</p>' +
      '<input id="kv26-feld" type="password" autocomplete="current-password" ' +
      'aria-label="Kurspasswort" placeholder="Kurspasswort" ' +
      'style="width:100%;box-sizing:border-box;padding:.7rem .8rem;font-size:1rem;' +
      'border:1px solid #c7cdd6;border-radius:8px">' +
      '<p id="kv26-fehler" role="alert" style="display:none;margin:.6rem 0 0;color:#b3261e;' +
      'font-size:.9rem">Das Passwort stimmt nicht.</p>' +
      '<button type="submit" style="margin-top:1rem;width:100%;padding:.7rem;font-size:1rem;' +
      'font-weight:600;color:#11161d;background:#5ce08a;border:0;border-radius:8px;' +
      'cursor:pointer">Weiter</button>' +
      '</form>';
    document.body.appendChild(box);

    var feld = box.querySelector('#kv26-feld');
    var fehler = box.querySelector('#kv26-fehler');
    feld.focus();

    box.querySelector('form').addEventListener('submit', function (e) {
      e.preventDefault();
      if (KENNWOERTER.indexOf(feld.value.trim()) !== -1) {
        merken();
        freigeben();
      } else {
        fehler.style.display = 'block';
        feld.value = '';
        feld.focus();
      }
    });
  }

  function start() {
    // In einem eingebetteten Rahmen keine eigene Abfrage, die umgebende Seite ist geschützt.
    if (window.self !== window.top) return freigeben();
    // Lokale Vorschau nicht abfragen.
    var h = window.location.hostname;
    if (h === 'localhost' || h === '127.0.0.1' || h === '') return freigeben();
    if (gemerkt()) return freigeben();
    formularZeigen();
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', start);
  } else {
    start();
  }
})();
</script>
<noscript><style>body > *:not(#kv26-sperre){visibility:visible}</style></noscript>
